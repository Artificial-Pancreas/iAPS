<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title description">
<title id="title">Smoothing can react late at a sharp turn</title>
<desc id="description">A synthetic rapid glucose fall and recovery compares raw readings with online Savitzky-Golay, Balanced Kalman, and exponential smoothing. The smoother curves turn after the true nadir.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
  .title { font-size: 25px; font-weight: 700; }
  .subtitle { font-size: 15px; fill: #475569; }
  .panel-title { font-size: 18px; font-weight: 700; }
  .panel-note { font-size: 14px; fill: #475569; }
  .axis-title { font-size: 14px; font-weight: 600; fill: #475569; }
  .tick { font-size: 13px; fill: #64748b; }
  .legend { font-size: 14px; fill: #475569; }
  .grid { stroke: #e2e8f0; stroke-width: 1; }
  .frame { fill: none; stroke: #64748b; stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="42" y="43" class="title">Smoothing can react late at a sharp turn</text>
<text x="42" y="69" class="subtitle">Illustrative rapid fall and recovery. Curves show each filter’s newest value at that moment, not a later revised history.</text>
<circle cx="82" cy="108" r="4" fill="#475569"/><text x="104" y="112" class="legend">Raw readings</text>
<line x1="240" y1="108" x2="265" y2="108" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 5"/><text x="274" y="112" class="legend">Underlying glucose</text>
<line x1="440" y1="108" x2="465" y2="108" stroke="#2563eb" stroke-width="3"/><text x="474" y="112" class="legend">SG — 3 passes</text>
<line x1="602" y1="108" x2="627" y2="108" stroke="#7c3aed" stroke-width="3"/><text x="636" y="112" class="legend">Kalman — Balanced</text>
<line x1="770" y1="108" x2="795" y2="108" stroke="#d97706" stroke-width="3"/><text x="804" y="112" class="legend">Exponential</text>
<line x1="92" y1="510.0" x2="862" y2="510.0" class="grid"/>
<text x="80" y="515.0" text-anchor="end" class="tick">49</text>
<line x1="92" y1="328.0" x2="862" y2="328.0" class="grid"/>
<text x="80" y="333.0" text-anchor="end" class="tick">95</text>
<line x1="92" y1="150.0" x2="862" y2="150.0" class="grid"/>
<text x="80" y="155.0" text-anchor="end" class="tick">140</text>
<text x="92.0" y="535" text-anchor="middle" class="tick">0</text>
<text x="477.0" y="535" text-anchor="middle" class="tick">60</text>
<text x="862.0" y="535" text-anchor="middle" class="tick">120</text>
<rect x="92" y="150" width="770" height="360" class="frame"/>
<text x="40" y="330" text-anchor="middle" class="axis-title" transform="rotate(-90 40 330)">Glucose (mg/dL)</text>
<text x="477" y="558" text-anchor="middle" class="axis-title">Elapsed time (minutes)</text>
<line x1="477.0" y1="150" x2="477.0" y2="510" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="487.0" y="172" class="panel-note">actual turning point</text>
