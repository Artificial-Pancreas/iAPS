<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="title desc">
<title id="title">A real peak: who notices the turn, and when</title>
<desc id="desc">Real 1-minute CGM readings around a glucose peak after a rise. The newest smoothed value and oref delta for Savitzky-Golay, Kalman Balanced and Exponential are compared with the raw readings and a centred hindsight reference.</desc>
