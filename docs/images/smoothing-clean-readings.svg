<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title description">
<title id="title">When readings are already clean, smoothing mainly changes timing</title>
<desc id="description">A synthetic low-noise glucose curve shows raw readings and all three smoothing methods. They differ most during a rapid rise, where smoothing changes timing rather than removing much noise.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
  .title { font-size: 25px; font-weight: 700; }
  .subtitle { font-size: 15px; fill: #475569; }
  .panel-title { font-size: 18px; font-weight: 700; }
  .panel-note { font-size: 14px; fill: #475569; }
  .axis-title { font-size: 14px; font-weight: 600; fill: #475569; }
  .tick { font-size: 13px; fill: #64748b; }
  .legend { font-size: 14px; fill: #475569; }
  .grid { stroke: #e2e8f0; stroke-width: 1; }
  .frame { fill: none; stroke: #64748b; stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="42" y="43" class="title">When readings are already clean, smoothing mainly changes timing</text>
<text x="42" y="69" class="subtitle">Illustrative low-noise 5-minute readings. There is little noise to remove; differences appear most during the rise.</text>
