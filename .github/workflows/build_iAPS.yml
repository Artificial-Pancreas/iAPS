name: 4. Build iAPS

on:
  workflow_dispatch:

env:
  FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
  TEAM_ID: ${{ secrets.TEAMID }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}

jobs:
  check_certs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Bundle install
        run: bundle install

      - name: Check Certificates
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAMID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: bundle exec fastlane check_certs

  build:
    needs: check_certs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Bundle install
        run: bundle install

      - name: Build iAPS
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAMID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: bundle exec fastlane build_iAPS

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iAPS-Build
          path: output/*.ipa
